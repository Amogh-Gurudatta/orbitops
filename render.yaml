# Render Blueprint: the OrbitOps web service (API + Socket.IO + built SPA on one origin) and the simulator worker.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: orbitops-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: 'true'
      - key: PERSIST_HZ
        value: '1'
      - key: RAW_TTL_HOURS
        value: '6'
      # Set in the Render dashboard: a mongodb+srv:// URI for an Atlas cluster with replica set support.
      - key: MONGODB_URI
        sync: false
      # Random 256-bit value generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      # Public origin of this web service, e.g. https://orbitops-web.onrender.com.
      - key: CLIENT_ORIGIN
        sync: false

  # Background worker for the telemetry simulator. Render does not offer a free plan for workers,
  # so this costs money. Alternative: run the simulator inside the web service behind an env flag
  # (this needs a server option that starts the simulator in-process; not implemented yet).
  - type: worker
    name: orbitops-simulator
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: node_modules/.bin/tsx packages/simulator/src/index.ts
    plan: starter
    envVars:
      - key: SERVER_URL
        sync: false
      - key: DEVICE_API_KEY
        fromService:
          type: web
          name: orbitops-web
          envVarKey: DEVICE_API_KEY
