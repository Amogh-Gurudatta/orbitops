# Render Blueprint: one free web service runs the API, Socket.IO, the built SPA (one origin) and,
# via EMBED_SIMULATOR, the satellite simulator as a supervised child process (Render has no free workers).
# To run the simulator elsewhere instead, set EMBED_SIMULATOR=false and start packages/simulator with
# SERVER_URL pointing here and the same DEVICE_API_KEY.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: orbitops-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: 'true'
      - key: PERSIST_HZ
        value: '1'
      - key: RAW_TTL_HOURS
        value: '6'
      # Demo accounts (viewer/operator/admin @orbitops.dev) so judges can sign straight in.
      - key: SEED_DEMO
        value: 'true'
      - key: EMBED_SIMULATOR
        value: 'true'
      - key: EMBED_SIMULATOR_HZ
        value: '2'
      # Set in the Render dashboard: a mongodb+srv:// URI for an Atlas cluster with replica set support.
      - key: MONGODB_URI
        sync: false
      # Random 256-bit value generated by Render on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: DEVICE_API_KEY
        generateValue: true
      # Public origin of this web service, e.g. https://orbitops-web.onrender.com.
      - key: CLIENT_ORIGIN
        sync: false
