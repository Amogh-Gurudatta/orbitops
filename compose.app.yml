# Full local stack: MongoDB (from docker-compose.yml) + OrbitOps server + simulator, built from the root Dockerfile.
# Usage:
#   JWT_SECRET=<32+ chars> DEVICE_API_KEY=<8+ chars> \
#     docker compose -f docker-compose.yml -f compose.app.yml up --build
# Open http://localhost:4000 once the server is healthy.
x-app-env: &app-env
  NODE_ENV: production

services:
  server:
    build: .
    image: orbitops:local
    environment:
      <<: *app-env
      # directConnection=true: the mongo service initiates the replica set with host 'localhost:27017',
      # which is not reachable from other containers. A direct connection skips topology discovery so
      # the server talks to the mongo container by its service name instead of the advertised host.
      MONGODB_URI: mongodb://mongo:27017/orbitops?replicaSet=rs0&directConnection=true
      SERVE_WEB: 'true'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ characters) before starting the stack}
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Set DEVICE_API_KEY before starting the stack}
    ports: ['4000:4000']
    depends_on:
      mongo:
        condition: service_healthy

  simulator:
    build: .
    image: orbitops:local
    command: ['node_modules/.bin/tsx', 'packages/simulator/src/index.ts']
    environment:
      <<: *app-env
      SERVER_URL: http://server:4000
      DEVICE_API_KEY: ${DEVICE_API_KEY:?Set DEVICE_API_KEY before starting the stack}
    # The image's HEALTHCHECK probes the server's /healthz; the simulator is a plain worker.
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_healthy
